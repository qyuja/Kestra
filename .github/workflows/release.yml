name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    env:
      HAS_NOTARIZATION_CREDENTIALS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    # Kestra targets macOS 26, so use the arm64 macOS 26 image explicitly.
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
          node --version

      - name: Run tests
        run: |
          swift test
          node script/test_pi.mjs
          node script/test_opencode.mjs

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ "$tag" != v* ]]; then
            tag="v$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          version="${tag#v}"
          version_core="${version%%-*}"
          IFS='.' read -r major minor patch _ <<< "$version_core"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
            echo "Release tag must use a numeric semver such as v0.1.4." >&2
            exit 1
          fi
          build_version=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

      - name: Prepare Sparkle publishing tools
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          sparkle_version="2.9.6"
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Sparkle signing key is not configured; publishing the DMG only."
            exit 0
          fi

          sparkle_root="$RUNNER_TEMP/Sparkle-$sparkle_version"
          sparkle_archive="$RUNNER_TEMP/Sparkle-for-Swift-Package-Manager-$sparkle_version.zip"
          curl --fail --silent --show-error --location \
            "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-for-Swift-Package-Manager.zip" \
            --output "$sparkle_archive"
          mkdir -p "$sparkle_root"
          ditto -x -k "$sparkle_archive" "$sparkle_root"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "tools=$sparkle_root/bin" >> "$GITHUB_OUTPUT"

      - name: Prepare signing identity
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/kestra-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/kestra-signing.p12"

          if [[ -z "$CERTIFICATE_BASE64" && -z "$CERTIFICATE_PASSWORD" && -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "No signing certificate configured; using an ad-hoc signature."
            exit 0
          fi

          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "All of MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD, and MACOS_KEYCHAIN_PASSWORD are required." >&2
            exit 1
          fi

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*\"\(Developer ID Application:.*\)\".*/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "The imported keychain does not contain a Developer ID Application identity." >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"

      - name: Build release app
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          APP_BUILD_VERSION: ${{ steps.release.outputs.build_version }}
          BUILD_CONFIGURATION: release
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          SPARKLE_ENABLED: ${{ steps.sparkle.outputs.enabled }}
        run: ./script/build_and_run.sh package

      - name: Validate app bundle
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Kestra.app
          codesign -dvv dist/Kestra.app 2>&1 | grep -E 'Identifier=|Signature=|TeamIdentifier=|Sealed Resources=' || true

      - name: Create and verify DMG
        id: dmg
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d -t kestra-release)"
          ditto dist/Kestra.app "$staging/Kestra.app"
          ln -s /Applications "$staging/Applications"
          dmg_path="dist/Kestra-${TAG}.dmg"
          hdiutil create -volname Kestra -srcfolder "$staging" -ov -format UDZO "$dmg_path"
          hdiutil verify "$dmg_path"
          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$dmg_path" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple DMG
        if: ${{ steps.signing.outputs.mode == 'developer-id' && env.HAS_NOTARIZATION_CREDENTIALS == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Report Gatekeeper status
        env:
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          if spctl -a -vv "$DMG_PATH"; then
            echo "Gatekeeper accepted the DMG."
          else
            echo "::warning::The DMG is structurally valid but is not notarized. Configure Developer ID and notarization secrets for normal double-click installation."
          fi

      - name: Create and sign Sparkle update archive
        id: sparkle_update
        if: ${{ steps.sparkle.outputs.enabled == 'true' }}
        env:
          SPARKLE_TOOLS: ${{ steps.sparkle.outputs.tools }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          TAG: ${{ steps.release.outputs.tag }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          SPARKLE_NOTARIZATION_READY: ${{ env.HAS_NOTARIZATION_CREDENTIALS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          updates_dir="$RUNNER_TEMP/kestra-updates"
          mkdir -p "$updates_dir"
          zip_path="$updates_dir/Kestra-${TAG}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Kestra.app "$zip_path"

          if [[ "$SIGNING_MODE" == "developer-id" && "$SPARKLE_NOTARIZATION_READY" == "true" ]]; then
            xcrun notarytool submit "$zip_path" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple dist/Kestra.app
            rm -f "$zip_path"
            ditto -c -k --sequesterRsrc --keepParent dist/Kestra.app "$zip_path"
          else
            echo "::warning::Sparkle archive is signed by Sparkle but not notarized. Configure Developer ID and notarization secrets for Gatekeeper-friendly updates."
          fi

          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_TOOLS/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/qyuja/Kestra/releases/download/$TAG/" \
            --maximum-deltas 0 \
            "$updates_dir"
          test -s "$updates_dir/appcast.xml"
          grep -q 'sparkle:edSignature=' "$updates_dir/appcast.xml"
          xmllint --noout "$updates_dir/appcast.xml"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "appcast_path=$updates_dir/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Compute final DMG checksum
        id: final_dmg
        env:
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          hdiutil verify "$DMG_PATH"
          echo "sha256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
          DMG_SHA256: ${{ steps.final_dmg.outputs.sha256 }}
          SPARKLE_ENABLED: ${{ steps.sparkle.outputs.enabled }}
          SPARKLE_ZIP_PATH: ${{ steps.sparkle_update.outputs.zip_path }}
          APPCAST_PATH: ${{ steps.sparkle_update.outputs.appcast_path }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("$DMG_PATH")
          if [[ "$SPARKLE_ENABLED" == "true" ]]; then
            test -f "$SPARKLE_ZIP_PATH"
            test -f "$APPCAST_PATH"
            assets+=("$SPARKLE_ZIP_PATH" "$APPCAST_PATH")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$TARGET_SHA" \
              --title "Kestra $TAG" \
              --generate-notes
          fi
          echo "Published $DMG_PATH ($DMG_SHA256)"

      - name: Clean signing keychain
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/kestra-signing.keychain-db" >/dev/null 2>&1 || true
